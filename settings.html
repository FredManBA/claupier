<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajustes de Claupier</title>
    <script type="module" src="/src/settings/settings.ts"></script>
  </head>
  <body>
    <header class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <canvas class="brand-chip" id="brand-chip" width="18" height="11" aria-hidden="true"></canvas>
        <h1 class="title" data-tauri-drag-region>Claupier</h1>
        <span class="subtitle" data-tauri-drag-region>Ajustes</span>
      </div>
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <button class="close" type="button" aria-label="Cerrar ajustes" id="close">
        <svg viewBox="0 0 7 7" width="14" height="14" aria-hidden="true" shape-rendering="crispEdges">
          <path d="M0 0h1v1H0zM1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 5h1v1H5zM6 6h1v1H6zM6 0h1v1H6zM5 1h1v1H5zM4 2h1v1H4zM2 4h1v1H2zM1 5h1v1H1zM0 6h1v1H0z" />
        </svg>
      </button>
    </header>
    <div class="layout">
      <nav class="nav" role="tablist" aria-label="Secciones" id="nav"></nav>
      <main class="content" id="content"></main>
    </div>
  </body>
</html>
